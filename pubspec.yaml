name: ai_field_assistant
description: "Nền tảng ứng dụng mobile-first ghi nhận sự cố hiện trường."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_file_saver: ^0.10.0
  image: ^4.10.1
  image_picker: ^1.2.3
  path: 1.9.1
  path_provider: 2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  sqflite: 2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/roboto-regular.ttf
    - assets/fonts/roboto-bold.ttf
